# Archivo: docker-compose.yaml
# Version: 3.8 - PRODUCTION (latest pinned by cache)
# Descripción: n8n usando latest con volumen persistente y healthchecks robustos.

services:
  n8n:
    image: 'n8nio/n8n:latest'
    restart: always
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SERVICE_URL_N8N_5678
      - 'N8N_EDITOR_BASE_URL=${SERVICE_URL_N8N}'
      - 'WEBHOOK_URL=${SERVICE_URL_N8N}'
      - 'N8N_PROTOCOL=${N8N_PROTOCOL:-https}'
      - 'GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Monterrey}'
      - 'TZ=${TZ:-America/Monterrey}'
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgresql
      - DB_POSTGRESDB_PORT=5432
      - 'DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}'
      - 'DB_POSTGRESDB_USER=${SERVICE_USER_POSTGRES}'
      - 'DB_POSTGRESDB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - DB_POSTGRESDB_SCHEMA=public
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - 'N8N_ENCRYPTION_KEY=${SERVICE_PASSWORD_ENCRYPTION}'
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_BROKER_PORT=5679
      - 'N8N_RUNNERS_AUTH_TOKEN=${SERVICE_PASSWORD_N8N}'
      - N8N_NATIVE_PYTHON_RUNNER=false
      - N8N_PROXY_HOPS=1
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:5678/healthz || exit 1'
      interval: 10s
      timeout: 5s
      retries: 10
  n8n-worker:
    image: 'n8nio/n8n:latest'
    command: worker
    restart: always
    environment:
      - 'GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Monterrey}'
      - 'TZ=${TZ:-America/Monterrey}'
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgresql
      - DB_POSTGRESDB_PORT=5432
      - 'DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}'
      - 'DB_POSTGRESDB_USER=${SERVICE_USER_POSTGRES}'
      - 'DB_POSTGRESDB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - DB_POSTGRESDB_SCHEMA=public
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - 'N8N_ENCRYPTION_KEY=${SERVICE_PASSWORD_ENCRYPTION}'
      - N8N_RUNNERS_MODE=external
      - 'N8N_RUNNERS_AUTH_TOKEN=${SERVICE_PASSWORD_N8N}'
      - N8N_NATIVE_PYTHON_RUNNER=false
    volumes:
      - 'n8n_data:/home/node/.n8n'
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
  task-runners:
    image: 'n8nio/runners:latest'
    environment:
      - 'N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679'
      - 'N8N_RUNNERS_AUTH_TOKEN=${SERVICE_PASSWORD_N8N}'
      - N8N_RUNNERS_MAX_CONCURRENCY=10
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=15
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      disable: true

  postgresql:
    image: 'postgres:16-alpine'
    restart: always
    environment:
      - 'POSTGRES_USER=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'POSTGRES_DB=${POSTGRES_DB:-n8n}'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: 'redis:alpine'
    restart: always
    volumes:
      - 'evolution_redis:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local
  evolution_redis:
    driver: local
